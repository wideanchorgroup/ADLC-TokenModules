[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adlc-finops"
version = "1.0.0"
description = "Enterprise FinOps and Governance Control Plane consuming Compass, Distil, and Halos APIs"
authors = [{ name = "Wide Anchor Group" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
adlc-finops = "adlc_finops.cli:main"
adlc-server = "run_server:main"
